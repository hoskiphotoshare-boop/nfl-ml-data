version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: 1
      unit: "days"
    open-pull-requests-limit: 10
    reviewers:
      - "hoskiphotoshare-boop"
    commit-message:
      prefix: "chore"
      prefixPatterns: []
    ignore:
      - dependency-name: "nflreadpy"
        versions:
          - "0.5.0"
    allow:
      - dependency-type: "direct"
      - dependency-type: "transitive"