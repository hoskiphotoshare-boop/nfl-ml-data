name: CI

on:
  push:
    branches: [main]
    # Data-only refreshes deploy themselves; skip the full test suite for them.
    paths-ignore:
      - 'market/**'
      - 'reports/**'
      - 'predictions/**'
      - 'features/**'
      - 'frontend/data/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - run: pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - run: python -c "import src; print('import ok')"
      - run: pytest -q
