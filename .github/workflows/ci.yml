name: CI

on:
  push:
    branches: [main]
    # Data-only refreshes deploy themselves; skip the full test suite for them.
    paths-ignore:
      - 'market/**'
      - 'reports/**'
      - 'predictions/**'
      - 'features/**'
      - 'frontend/data/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --upgrade pip
      - run: pip install polars nflreadpy typer scikit-learn joblib pytest

      - run: python -c "import src; print('import ok')"
      - run: pytest -q
