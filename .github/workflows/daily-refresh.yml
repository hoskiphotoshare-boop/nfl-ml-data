name: Daily Inference

on:
  workflow_dispatch:
  schedule:
    # Tuesday is the full retrain (Ingest & Predict). This is inference-only.
    - cron: '0 11 * * 0,1,3-6'   # Wed–Mon 11:00 UTC; odds refresh at 12:00

permissions:
  contents: write

concurrency:
  group: ingest-and-train
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install polars nflreadpy scikit-learn joblib shap || true

      # Refresh current data and context, but keep the trained model weights.
      - run: python scripts/download_data.py || true
      - run: python scripts/build_features.py || true
      - run: python scripts/add_match_context.py || true
      - run: python scripts/add_player_context.py || true
      - run: python scripts/build_predictions.py || true
      - run: python scripts/train_player_models.py --predict-only || true

      - run: python scripts/predict_upcoming.py || true
      - run: python scripts/add_player_matchups.py || true
      - run: python scripts/fetch_weather.py || true
      - run: python scripts/explain_models.py || true
      - run: python scripts/compare_market.py || true
      - run: python scripts/line_movement.py || true
      - run: python scripts/simulate_playoffs.py || true
      - run: python scripts/compare_futures.py || true
      - run: python scripts/build_health_report.py || true

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add predictions/ features/ models/ reports/ market/ 2>/dev/null || true
          git commit -m "chore: daily inference refresh" || true
          git pull --rebase origin main || true
          git push origin main || true

      - run: python scripts/build_team_pages.py || true

      - name: Prepare static data for Pages
        run: |
          mkdir -p frontend/data/predictions frontend/data/reports
          cp predictions/*.json frontend/data/predictions/ 2>/dev/null || true
          cp reports/*.json frontend/data/reports/ 2>/dev/null || true

      - name: Deploy frontend to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy frontend --project-name nfl-ml-data --commit-dirty=true
