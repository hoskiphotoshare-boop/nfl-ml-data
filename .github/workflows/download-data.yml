name: Download NFL Data

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install polars nflreadpy

      - run: python scripts/download_data.py

      - upload-artifact@v3:
          name: nfl-data
          path: data/
          retention-days: 7