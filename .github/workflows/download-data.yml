name: Download NFL Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install polars nflreadpy || true

      - run: python scripts/download_data.py || true

      - name: Upload raw data artifact (not committed)
        uses: actions/upload-artifact@v4
        with:
          name: nfl-raw-data
          path: data/
          retention-days: 7
          if-no-files-found: warn