name: Download NFL Data

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install polars nflreadpy

      - run: python scripts/download_data.py || true

      # Note: the `data/` folder is git‑ignored (see .gitignore), so raw
      # NFL data never pollutes the repository history.  The artifact step
      # has been omitted until the script reliably produces parquet files.