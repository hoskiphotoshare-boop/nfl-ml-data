name: Weekly Retrain

on:
  workflow_dispatch:
    inputs:
      fetch_odds:
        description: "Fetch fresh Odds API data (uses 3 credits)"
        type: boolean
        default: false
      create_report:
        description: "Create or comment on the weekly model report issue"
        type: boolean
        default: false

# Scheduling is handled by the Google Apps Script project in gas/.
# This workflow only executes when dispatched or run manually.

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest-and-train
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-ci.txt || true

      # Attempt to fetch real data. If the APIs are unreachable,
      # the script exits 0 so the workflow can still build predictions.
      - run: python scripts/download_data.py || true

      - name: Wait for the latest NFL week
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python scripts/check_data_ready.py; then
              exit 0
            fi
            echo "Latest week incomplete (attempt $attempt/6); retrying in 15 minutes."
            sleep 900
          done
          echo "Latest week still incomplete after retries; failing."
          exit 1

      # Build feature tables (match + player).
      - run: python scripts/build_features.py || true
      - run: python scripts/add_match_context.py || true
      - run: python scripts/add_player_context.py || true

      # Write fallback prediction JSON (so the frontend always has data).
      - run: python scripts/build_predictions.py || true

      # Train baseline models and overwrite game/player predictions.
      - run: python scripts/train_models.py || true
      - run: python scripts/calibrate_probabilities.py || true

      # Train per-position player models and overwrite player projections.
      - run: python scripts/train_player_models.py || true

      # Predict upcoming games using the latest team features.
      - run: python scripts/predict_upcoming.py || true
      - run: python scripts/add_player_matchups.py || true
      - run: python scripts/fetch_weather.py || true
      - run: python scripts/build_game_context.py || true
      - run: python scripts/explain_models.py || true

      # Fetch current NFL odds from The Odds API (secret only available here).
      - name: Fetch NFL odds
        if: github.event_name == 'schedule' || github.event.inputs.fetch_odds == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REQUIRE_GAME_WITHIN_DAYS: "10"
          ODDS_MIN_REMAINING: "12"
        run: python scripts/fetch_odds.py || true

      # Compare model probabilities with market-implied probabilities.
      - name: Compare model to market
        run: python scripts/compare_market.py || true
      - run: python scripts/update_calls.py || true
      - run: python scripts/line_movement.py || true

      # Calibrate model probabilities to market-implied probabilities.
      - name: Calibrate model to market
        run: python scripts/calibrate_model.py || true

      # Track closing-line movement across stored odds snapshots.
      - run: python scripts/backtest_market.py || true

      # Run the Monte Carlo playoff / Super Bowl simulator.
      - run: python scripts/simulate_playoffs.py || true
      - run: python scripts/backtest_playoffs.py || true
      - run: python scripts/compare_futures.py || true

      # Walk-forward backtest of the match model.
      - run: python scripts/backtest.py || true

      # Feature-group ablation study.
      - run: python scripts/feature_ablation.py || true

      # Research diagnostics: practice participation, total errors, feature use.
      - run: python scripts/ablate_practice.py || true
      - run: python scripts/audit_total_errors.py || true
      - run: python scripts/audit_feature_stability.py || true

      - run: python scripts/build_health_report.py || true
      - run: python scripts/build_model_scorecard.py || true

      - run: python scripts/weekly_report.py > weekly_report.md || true

      - name: Weekly report issue
        if: github.event_name == 'schedule' || github.event.inputs.create_report == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Weekly Model Report"
          NUMBER=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "${{ github.repository }}" --body-file weekly_report.md
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file weekly_report.md
          fi

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - run: |
          git add predictions/ features/ models/ reports/ market/ 2>/dev/null || true
          git commit -m "chore: update predictions, features, and models" || true

      - run: |
          git pull --rebase origin main || true
          git push origin main || true

      - name: Prepare static site
        run: python scripts/prepare_site.py

      - name: Deploy frontend to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.169.0 pages deploy frontend --project-name nfl-ml-data --commit-dirty=true
