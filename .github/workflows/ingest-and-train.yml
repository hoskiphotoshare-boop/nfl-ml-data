name: Ingest & Predict

on:
  workflow_dispatch:
    inputs:
      fetch_odds:
        description: "Fetch fresh Odds API data (uses one API request)"
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC

permissions:
  contents: write

concurrency:
  group: ingest-and-train
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install polars nflreadpy scikit-learn joblib || true

      # Attempt to fetch real data. If the APIs are unreachable,
      # the script exits 0 so the workflow can still build predictions.
      - run: python scripts/download_data.py || true

      # Build feature tables (match + player).
      - run: python scripts/build_features.py || true

      # Write fallback prediction JSON (so the frontend always has data).
      - run: python scripts/build_predictions.py || true

      # Train baseline models and overwrite game/player predictions.
      - run: python scripts/train_models.py || true

      # Train per-position player models and overwrite player projections.
      - run: python scripts/train_player_models.py || true

      # Predict upcoming games using the latest team features.
      - run: python scripts/predict_upcoming.py || true

      # Fetch current NFL odds from The Odds API (secret only available here).
      - name: Fetch NFL odds
        if: github.event_name == 'schedule' || github.event.inputs.fetch_odds == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py || true

      # Compare model probabilities with market-implied probabilities.
      - name: Compare model to market
        run: python scripts/compare_market.py || true

      # Calibrate model probabilities to market-implied probabilities.
      - name: Calibrate model to market
        run: python scripts/calibrate_model.py || true

      # Run the Monte Carlo playoff / Super Bowl simulator.
      - run: python scripts/simulate_playoffs.py || true

      # Walk-forward backtest of the match model.
      - run: python scripts/backtest.py || true

      # Feature-group ablation study.
      - run: python scripts/feature_ablation.py || true

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - run: |
          git add predictions/ features/ models/ reports/ market/ 2>/dev/null || true
          git commit -m "chore: update predictions, features, and models" || true

      - run: |
          git pull --rebase origin main || true
          git push origin main || true