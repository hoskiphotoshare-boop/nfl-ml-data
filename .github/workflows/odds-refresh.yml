name: Odds Refresh

# Budget: The Odds API free tier is 500 credits/month and one request
# (h2h + spreads + totals × us) costs 3 credits. This schedule spends
# roughly 220 credits/month (~45%), including buffer for retries.
#
# Times are chosen for line freshness and are stable across US daylight
# saving changes:
#   * two weekday updates (morning + evening ET)
#   * five Sunday updates, ending just before each kickoff window
#   * one Thursday and one Monday pre-game update for primetime games
#
# Every odds run also performs an inference-only refresh (context, predictions,
# SHAP, playoff sim) before comparing the model to the new prices.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass cache and fetch now"
        type: boolean
        default: true

# Scheduling is handled by the Google Apps Script project in gas/.
# The scheduler dispatches this workflow at the odds windows below.

permissions:
  contents: write

concurrency:
  group: ingest-and-train
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    env:
      ODDS_CACHE_HOURS: "0.4"                 # avoid duplicate calls within ~25 min
      ODDS_REQUIRE_GAME_WITHIN_DAYS: "10"     # no NFL games → no credits
      ODDS_MIN_REMAINING: "12"                # keep a small reserve
      FUTURES_CACHE_HOURS: "20"               # one Super Bowl futures fetch per day
      FORCE_ODDS_FETCH: ${{ inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --upgrade pip
      - run: pip install polars nflreadpy scikit-learn joblib shap

      - name: Refresh inference (context, predictions, SHAP, sim)
        run: |
          python scripts/download_data.py || true
          python scripts/build_features.py || true
          python scripts/add_match_context.py || true
          python scripts/add_player_context.py || true
          python scripts/build_predictions.py || true
          python scripts/train_player_models.py --predict-only || true
          python scripts/predict_upcoming.py || true
          python scripts/add_player_matchups.py || true
          python scripts/fetch_weather.py || true
          python scripts/explain_models.py || true
          python scripts/simulate_playoffs.py || true

      - name: Fetch NFL odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py || true

      - name: Fetch Super Bowl futures
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_futures.py || true

      - name: Check for new odds
        id: changes
        run: |
          if [ -n "$(git status --porcelain market reports predictions features models)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare model to market
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/compare_market.py || true

      - name: Update call ledger
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/update_calls.py || true

      - name: Compare model to futures
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/compare_futures.py || true

      - name: Track line movement
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/backtest_market.py || true

      - name: Refresh movement and health reports
        if: steps.changes.outputs.changed == 'true'
        run: |
          python scripts/line_movement.py || true
          python scripts/build_health_report.py || true

      - name: Commit odds and reports
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add market/ reports/ predictions/ features/ models/ 2>/dev/null || true
          git commit -m "chore: odds refresh $(date -u +'%Y-%m-%d %H:%M UTC')" || true
          git pull --rebase origin main || true
          git push origin main || true

      - name: Prepare static site
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/prepare_site.py

      - name: Deploy frontend to Cloudflare Pages
        if: steps.changes.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy frontend --project-name nfl-ml-data --commit-dirty=true
