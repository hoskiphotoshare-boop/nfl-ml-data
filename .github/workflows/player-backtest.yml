name: Player Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements-ci.txt || true

      - run: python scripts/download_data.py || true
      - run: python scripts/build_features.py || true
      - run: python scripts/train_player_models.py || true
      - run: python scripts/add_player_matchups.py || true
      - run: python scripts/build_game_context.py || true
      - run: python scripts/explain_models.py || true
      - run: python scripts/build_health_report.py || true
      - run: python scripts/build_model_scorecard.py || true

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add predictions/players_week.json predictions/meta.json features/ models/ reports/player_backtest.json reports/model_health.json reports/model_explanations.json 2>/dev/null || true
          git commit -m "chore: update player model backtest" || true
          git pull --rebase origin main || true
          git push origin main || true
