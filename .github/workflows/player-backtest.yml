name: Player Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install polars nflreadpy scikit-learn joblib || true

      - run: python scripts/download_data.py || true
      - run: python scripts/build_features.py || true
      - run: python scripts/train_player_models.py || true

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add predictions/players_week.json reports/player_backtest.json models/player_models.joblib 2>/dev/null || true
          git commit -m "chore: update player model backtest" || true
          git pull --rebase origin main || true
          git push origin main || true
