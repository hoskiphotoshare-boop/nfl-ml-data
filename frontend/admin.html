<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFL ML — Admin</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client"></script>
</head>
<body>
  <header>
    <h1>NFL ML — Admin</h1>
    <p class="subtitle">Diagnostics and model health</p>
  </header>

  <main>
    <section id="login-gate">
      <h2>Administrator sign-in</h2>
      <p class="subtitle">Only the configured administrator account can access diagnostics.</p>
      <div id="google-signin"></div>
      <p id="login-error" class="injury"></p>
    </section>

    <div id="admin-content" style="display: none">
      <div class="filters" style="justify-content: flex-end">
        <button id="signout-btn" class="pick-btn" type="button">Sign out</button>
      </div>

      <section>
        <h2>Data freshness</h2>
        <div id="meta" class="card-grid"></div>
      </section>

      <section>
        <h2>Match backtest</h2>
        <div id="match-backtest" class="card-grid"></div>
      </section>

      <section>
        <h2>Player backtest</h2>
        <div id="player-backtest" class="card-grid"></div>
      </section>

      <section>
        <h2>Feature ablation</h2>
        <div id="ablation" class="card-grid"></div>
      </section>

      <section>
        <h2>Market comparison</h2>
        <div id="market" class="card-grid"></div>
      </section>

      <section>
        <h2>Quick links</h2>
        <p><a href="/">Public site</a> · <a href="/teams/">Team pages</a></p>
      </section>
    </div>
  </main>

  <footer>
    <p>Admin diagnostics · no index</p>
  </footer>

  <script>
    const ADMIN_EMAIL = "michael.y.ho@gmail.com";
    const CLIENT_ID =
      "570041522732-ck0ps6hfcopfkpai4s87be63k3fm9g14.apps.googleusercontent.com";

    const DATA = "/data";
    const R = `${DATA}/reports`;
    const P = `${DATA}/predictions`;

    function el(tag, className, text) {
      const n = document.createElement(tag);
      if (className) n.className = className;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    async function getJSON(url) {
      const res = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`${url}: ${res.status}`);
      return res.json();
    }

    function card(title, lines) {
      const c = el("div", "card");
      c.appendChild(el("h3", "", title));
      lines.forEach((line) => c.appendChild(el("p", "", line)));
      return c;
    }

    function decodeJwt(token) {
      try {
        const payload = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        return JSON.parse(decodeURIComponent(escape(atob(payload))));
      } catch {
        return null;
      }
    }

    function showAdmin() {
      document.getElementById("login-gate").style.display = "none";
      document.getElementById("admin-content").style.display = "block";
    }

    function showLoginError(message) {
      document.getElementById("login-error").textContent = message || "";
    }

    function handleCredentialResponse(response) {
      const payload = decodeJwt(response.credential);
      if (!payload) {
        showLoginError("Could not read Google credential.");
        return;
      }
      if (!payload.email_verified || payload.email !== ADMIN_EMAIL) {
        showLoginError("This account is not authorized for admin access.");
        return;
      }
      sessionStorage.setItem("nfl_admin_email", payload.email);
      showLoginError("");
      showAdmin();
      load();
    }

    async function load() {
      // Data freshness
      try {
        const meta = await getJSON(`${P}/meta.json`);
        const metaEl = document.getElementById("meta");
        metaEl.innerHTML = "";
        metaEl.appendChild(card("Last generated", [new Date(meta.generated_at).toLocaleString()]));
        metaEl.appendChild(card("Games", [String(meta.games)]));
        metaEl.appendChild(card("Season", [String(meta.season)]));
      } catch (e) {
        document.getElementById("meta").appendChild(card("Meta unavailable", [String(e)]));
      }

      // Match backtest
      try {
        const r = await getJSON(`${R}/backtest.json`);
        const p = r.pooled || {};
        const elm = document.getElementById("match-backtest");
        elm.innerHTML = "";
        elm.appendChild(card("Pooled accuracy", [(p.accuracy ?? 0).toFixed(4)]));
        elm.appendChild(card("Pooled log loss", [(p.log_loss ?? 0).toFixed(4)]));
        elm.appendChild(card("Pooled Brier", [(p.brier ?? 0).toFixed(4)]));
        elm.appendChild(card("Pooled AUC", [(p.auc ?? 0).toFixed(4)]));
      } catch (e) {
        document.getElementById("match-backtest").appendChild(card("Backtest unavailable", [String(e)]));
      }

      // Player backtest
      try {
        const r = await getJSON(`${R}/player_backtest.json`);
        const elm = document.getElementById("player-backtest");
        elm.innerHTML = "";
        Object.entries(r).forEach(([pos, m]) => {
          elm.appendChild(card(pos, [`MAE ${m.mae}`, `RMSE ${m.rmse}`, `n ${m.rows}`]));
        });
      } catch (e) {
        document.getElementById("player-backtest").appendChild(card("Player backtest unavailable", [String(e)]));
      }

      // Feature ablation
      try {
        const r = await getJSON(`${R}/feature_ablation.json`);
        const elm = document.getElementById("ablation");
        elm.innerHTML = "";
        Object.entries(r).forEach(([name, data]) => {
          const p = data.pooled || {};
          elm.appendChild(
            card(name, [
              `acc ${(p.accuracy ?? 0).toFixed(4)}`,
              `logloss ${(p.log_loss ?? 0).toFixed(4)}`,
              `brier ${(p.brier ?? 0).toFixed(4)}`,
              `auc ${(p.auc ?? 0).toFixed(4)}`,
            ])
          );
        });
      } catch (e) {
        document.getElementById("ablation").appendChild(card("Ablation unavailable", [String(e)]));
      }

      // Market comparison
      try {
        const r = await getJSON(`${R}/market_comparison.json`);
        const s = r.summary || {};
        const elm = document.getElementById("market");
        elm.innerHTML = "";
        elm.appendChild(card("Games compared", [String(s.games_compared ?? 0)]));
        elm.appendChild(card("Mean edge", [`${((s.mean_edge ?? 0) * 100).toFixed(2)}%`]));
        elm.appendChild(card("Mean abs edge", [`${((s.mean_abs_edge ?? 0) * 100).toFixed(2)}%`]));
        elm.appendChild(card("Max abs edge", [`${((s.max_abs_edge ?? 0) * 100).toFixed(2)}%`]));
      } catch (e) {
        document.getElementById("market").appendChild(card("Market report unavailable", [String(e)]));
      }
    }

    function initAuth() {
      if (sessionStorage.getItem("nfl_admin_email") === ADMIN_EMAIL) {
        showAdmin();
        load();
        return;
      }

      if (!window.google || !google.accounts || !google.accounts.id) {
        showLoginError("Google sign-in is unavailable. Try reloading the page.");
        return;
      }

      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleCredentialResponse,
      });

      google.accounts.id.renderButton(document.getElementById("google-signin"), {
        theme: "outline",
        size: "large",
        text: "signin_with",
        shape: "rectangular",
      });
    }

    document.getElementById("signout-btn").addEventListener("click", () => {
      sessionStorage.removeItem("nfl_admin_email");
      location.reload();
    });

    window.addEventListener("load", initAuth);
  </script>
</body>
</html>
