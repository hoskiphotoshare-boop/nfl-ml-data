[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nfl-ml-data"
version = "0.1.0"
description = "NFL predictive modeling pipeline (match outcomes, player stats, playoff outcomes)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.dependencies]
polars = "^1.0"
nflreadpy = "^0.5"
typer = "^0.12"
scikit-learn = "^1.4"
joblib = "^1.3"
requests = "^2.31"

[project.scripts]
nfl-ml-ingest = "src.ingest:main"
nfl-ml-features = "src.features:main"

[tool.setuptools.packages.find]
where = ["src"]